<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carbon Footprint Evolution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: transparent;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .wrapper {
      width: 100%;
      max-width: 820px;
      background: linear-gradient(160deg, #eef5e8 0%, #f8fbf4 100%);
      border-radius: 24px;
      box-shadow: 0 10px 50px rgba(40,80,40,0.13);
      padding: 36px 32px 30px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .title-row {
      display: flex;
      align-items: baseline;
      gap: 14px;
    }
    .title-main {
      font-size: 22px;
      font-weight: 700;
      color: #2a5e2a;
      letter-spacing: -0.3px;
    }
    .title-unit {
      font-size: 12px;
      color: #7aaa6a;
    }

    svg.chart { width: 100%; height: auto; overflow: visible; display: block; }

    /* year slider section */
    .slider-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .year-btns {
      display: flex;
      gap: 14px;
    }
    .year-btn {
      background: none;
      border: 2px solid #c0d8b0;
      border-radius: 20px;
      padding: 5px 20px;
      font-size: 14px;
      font-weight: 600;
      color: #6a9a6a;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .year-btn:hover { border-color: #8bc34a; color: #2a5e2a; }
    .year-btn.active { background: #5cb870; border-color: #5cb870; color: #fff; }

    input[type=range] {
      width: 90%;
      max-width: 260px;
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      border-radius: 5px;
      background: linear-gradient(to right, #5cb870, #c8e840);
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #5cb870;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.15s;
    }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
    input[type=range]::-moz-range-thumb {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #5cb870;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      cursor: pointer;
    }

    /* ── Bottom row: year-selector + legend side by side ── */
    .bottom-row {
      display: flex;
      align-items: flex-start;
      gap: 18px;
    }
    .slider-section {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding-top: 22px;      /* pushed down */
      min-width: 260px;
    }
    .year-heading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .year-label-txt {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: #5a8a2a;
      opacity: 0.7;
      font-family: 'Inter', sans-serif;
    }
    .year-badge {
      font-size: 15px;
      font-weight: 800;
      color: #2a5e2a;
      background: rgba(90,140,42,0.10);
      padding: 1px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      font-family: 'Inter', sans-serif;
    }

    /* ── HTML legend box ── */
    .legend-box {
      flex: 1;
      background: rgba(238,245,232,0.93);
      border: 1px solid #c4d8b4;
      border-radius: 10px;
      padding: 10px 12px 12px;
      min-width: 0;
    }
    .legend-hint {
      text-align: center;
      font-size: 11.5px;
      color: #7aaa7a;
      font-style: italic;
      font-family: 'Inter', sans-serif;
      padding-bottom: 8px;
      border-bottom: 0.8px solid #c4d8b4;
      margin-bottom: 6px;
      animation: cfHintBlink 2s ease-in-out infinite;
    }
    .legend-items {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-auto-flow: column;
      grid-template-rows: repeat(4, auto);
      row-gap: 6px;
      column-gap: 8px;
    }
    .cf-leg-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 11px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      color: #2a5e2a;
      padding: 2px 0;
    }
    .cf-swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
      transition: transform 0.15s;
    }
    .cf-name  { flex: 1; }
    .cf-pct   { font-weight: 700; font-size: 11px; visibility: hidden; color: #2a5e2a; }

    .cf-leg-item.active .cf-swatch { transform: scale(1.35); }
    .cf-leg-item.active .cf-name   { font-weight: 700; color: #1a4a1a; font-size: 12px; }
    .cf-leg-item.active .cf-pct    { visibility: visible; }
    .cf-leg-item.locked .cf-swatch { box-shadow: 0 0 0 2px var(--sw-color); }
    .cf-leg-item.locked .cf-name   { font-weight: 700; color: #1a4a1a; }
    .cf-leg-item.locked .cf-pct    { visibility: visible; }
    .cf-leg-item.dim               { opacity: 0.35; }
    .cf-leg-item.dim .cf-name      { color: #9aba9a; }

    /* ── Hover interactions on SVG foot bands ── */
    .cf-band   { cursor: pointer; transition: filter 0.2s, opacity 0.2s; }
    .cf-band.dim   { filter: brightness(0.65); opacity: 0.5; }

    @keyframes cfPulse {
      0%,100% { filter: brightness(1.06); }
      50%     { filter: brightness(1.15); }
    }
    @keyframes cfIntro {
      0%,100% { filter: brightness(1); }
      50%     { filter: brightness(1.12); }
    }
    .cf-band.intro   { animation: cfIntro 1.6s ease-in-out 2; }
    .cf-band.active  { animation: cfPulse 1.1s ease-in-out infinite; }

    @keyframes cfHintBlink {
      0%,100% { opacity: 0.55; }
      50%      { opacity: 1; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="title-row">
    <span class="title-main">Carbon Footprint Evolution</span>
    <span class="title-unit">CO₂-eq kg / kg fish</span>
  </div>

  <svg class="chart" id="chart" viewBox="0 0 820 450" preserveAspectRatio="xMidYMid meet"></svg>

  <div class="bottom-row">
    <div class="slider-section">
      <div class="year-heading">
        <span class="year-label-txt">Select Year</span>
        <span class="year-badge" id="yearBadge">2025</span>
      </div>
      <div class="year-btns" id="yearBtns"></div>
      <input type="range" id="yearSlider" min="2022" max="2025" step="1" value="2025" />
    </div>
    <div class="legend-box" id="legendBox">
      <div class="legend-hint" id="legendHint">↑ hover · click to pin a category</div>
      <div class="legend-items" id="legendItems"></div>
    </div>
  </div>
</div>

<script>
// ── Data ─────────────────────────────────────────────────────────────────────
const BASELINE = { year: 2020, total: 2.17 };

const DATA = {
  2022: { total: 2.05, reduction: -5.5,  cats: { 'Feed Production': 0.17, 'Transport': 0.15, 'Microingredients': 0.14, 'LAPs/PAPs': 0.08, 'Plant Oils': 0.18, 'Plant Dry Matter': 1.15, 'Marine Oils': 0.06, 'Marine Dry Matter': 0.12 } },
  2023: { total: 1.91, reduction: -11.9, cats: { 'Feed Production': 0.10, 'Transport': 0.08, 'Microingredients': 0.12, 'LAPs/PAPs': 0.15, 'Plant Oils': 0.15, 'Plant Dry Matter': 1.05, 'Marine Oils': 0.10, 'Marine Dry Matter': 0.16 } },
  2024: { total: 1.86, reduction: -14.4, cats: { 'Feed Production': 0.10, 'Transport': 0.07, 'Microingredients': 0.18, 'LAPs/PAPs': 0.18, 'Plant Oils': 0.16, 'Plant Dry Matter': 0.98, 'Marine Oils': 0.11, 'Marine Dry Matter': 0.08 } },
  2025: { total: 1.47, reduction: -32.1, cats: { 'Feed Production': 0.10, 'Transport': 0.10, 'Microingredients': 0.21, 'LAPs/PAPs': 0.22, 'Plant Oils': 0.12, 'Plant Dry Matter': 0.62, 'Marine Oils': 0.06, 'Marine Dry Matter': 0.04 } },
};

// bottom → top
const ORDER = ['Feed Production','Transport','Microingredients','LAPs/PAPs','Plant Oils','Plant Dry Matter','Marine Oils','Marine Dry Matter'];

const COLORS = {
  'Feed Production':   '#1a5e3a',
  'Transport':         '#2d7a52',
  'Microingredients':  '#a8c8b0',
  'LAPs/PAPs':         '#c0d8c0',
  'Plant Oils':        '#d4ecd4',
  'Plant Dry Matter':  '#5cb870',
  'Marine Oils':       '#8ec840',
  'Marine Dry Matter': '#c8e840',
};

// ── Chart constants ───────────────────────────────────────────────────────────
const W = 820, H = 450;
const CT = 75, CB = 435;      // chart top / bottom y
const CH = CB - CT;           // 360 px chart height
const MAX_V = 2.5;
const PPU = CH / MAX_V;       // px per unit  = 144

const GHOST_X      = 200;
const FOOT_X_START = 420;   // x-centre of current foot at year 2022
const FOOT_X_END   = 600;   // x-centre of current foot at year 2025
const FOOT_YEARS   = [2022, 2025];
function footX(year) {
  const t = (year - FOOT_YEARS[0]) / (FOOT_YEARS[1] - FOOT_YEARS[0]);
  return Math.round(FOOT_X_START + t * (FOOT_X_END - FOOT_X_START));
}

// ── Foot shape — real SVG paths (viewBox 0 0 286.97 650.01) ──────────────────
const FOOT_PATHS = [
  // main body
  `M168.24,100.3c-69.64,0-146.88,49.9-159.47,115.84-12.85,67.3,24.94,90,46.47,144.85,4.42,11.25,8.08,22.61,11.22,34.04,12.02,43.73,16.36,88.58,25.52,132.98,1.24,6.03,2.57,12.05,4.03,18.05.24.98.48,1.96.73,2.95,5.09,20.24,12.03,39.68,22.14,55.99,5.78,9.33,12.6,17.63,20.7,24.5,14.88,12.61,34.09,20.34,59.16,20.51.18,0,.37,0,.56,0,20.69,0,36.02-8.03,46.65-20.51,5.95-6.98,10.43-15.35,13.56-24.5,5.91-17.31,6.96-37.38,3.96-55.99-1.18-7.31-2.98-14.4-5.37-21-.55-1.53-1.14-3.03-1.75-4.51-15.76-37.81-40.09-59.42-48.16-102.82-1.68-9.06-2.77-17.55-3.28-25.65-2.19-34.85,6.33-62.43,24.37-96.23,13.21-24.75,29.72-47.57,37.4-76.11,10.74-39.94.05-83.6-36.4-106.02-18.33-11.28-39.8-16.37-62.03-16.37`,
  // toe 1
  `M53.77,54.49c-2.71,0-5.48,1.13-8.51,3.7-.34.29-.66.58-.97.89-5.38,5.28-6.7,13.28-5.42,21,1.05,6.34,3.86,12.49,7.6,16.78,5.92,6.79,12.35,9.54,18.19,9.54,12.85,0,22.8-13.35,18.06-26.32-.68-1.88-1.67-3.75-3.01-5.56-2.22-3.02-12.08-12.42-15.78-15.43-.14-.12-.3-.24-.42-.34-3.41-2.66-6.54-4.24-9.74-4.24`,
  // toe 2
  `M20.43,103.09c-.88,0-1.69.09-2.37.27-.7.19-9.71,5.44-10.78,6.23-11.85,8.76-7.91,18.58,2.31,26.52,4.99,3.88,9.98,5.51,14.51,5.51,15.43,0,25.6-18.9,12.89-32.29-3-3.16-11.27-6.25-16.56-6.25`,
  // toe 3
  `M169.52,1.61c-.61,0-1.22.03-1.84.09-7.21.72-14.08,6.38-18.15,12.14-10.54,14.92-8.04,34.48,3.1,45.22,5.05,4.87,11.86,7.94,20.04,7.94,1.76,0,3.58-.14,5.46-.44,4.77-.75,8.39-3.51,10.96-7.5,11.11-17.24,2.41-57.46-19.55-57.46`,
  // toe 4
  `M100.81,20.8c-1.45,0-2.94.09-4.48.28-22.03,2.65-23.13,23.04-13.68,37.99,5.37,8.5,14.14,15.23,24.42,15.95.68.05,1.34.07,1.98.07,11.17,0,15.35-7.16,16.55-16.02.64-4.71.44-9.89,0-14.74-1.36-14.96-10.78-23.53-24.8-23.53`,
  // toe 5 (big)
  `M247.91,0C215.8,0,203.76,30.01,208.78,59.07c.23,1.34.49,2.67.8,4,1.59,6.98,4.25,12.62,7.67,17,6.27,8.03,15.07,11.79,24.39,11.79s20.05-4.12,28.63-11.79c2.57-2.29,4.98-4.91,7.17-7.82,2.96-3.94,5.23-8.42,6.82-13.17,8.15-24.42-1.94-56.07-31.14-58.82C251.32.08,249.58,0,247.91,0`,
];

// foot coordinate space: x: 0–286.97, y: 0 (toe tips) → 650 (heel bottom)
const ANCHOR_X = 143, ANCHOR_Y = 650, FOOT_H = 650;
const FOOT_RIGHT = 272; // approximate right edge of body for label anchor

function footScale(total) { return (total * PPU) / FOOT_H; }
function valToY(v)        { return CB - v * PPU; }

// ── SVG helpers ───────────────────────────────────────────────────────────────
const SVG_NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(content, attrs = {}, parent) {
  const e = el('text', attrs, parent);
  e.textContent = content;
  return e;
}

// ── Build static skeleton ─────────────────────────────────────────────────────
const svg = document.getElementById('chart');

const defs = el('defs', {}, svg);

// shared foot clipPath (foot coordinate space — all 6 paths)
const clip = el('clipPath', { id: 'footClip' }, defs);
FOOT_PATHS.forEach(d => el('path', { d }, clip));

// background rect
el('rect', { x: 0, y: 0, width: W, height: H, fill: 'none' }, svg);

// grid lines & Y-axis labels
const yTicks = [0, 0.5, 1.0, 1.5, 2.0, 2.5];
const gridG = el('g', {}, svg);
yTicks.forEach(v => {
  el('line', { x1: 62, y1: valToY(v), x2: W - 10, y2: valToY(v), stroke: '#d0ddc8', 'stroke-width': 1 }, gridG);
  txt(v.toFixed(2), { x: 55, y: valToY(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: '#7aaa6a', 'font-family': 'Inter,sans-serif' }, gridG);
});

// baseline dotted line (static)
el('line', { x1: 62, y1: valToY(BASELINE.total), x2: W - 10, y2: valToY(BASELINE.total),
  stroke: '#8bc34a', 'stroke-width': 1.5, 'stroke-dasharray': '5,4' }, svg);
// baseline label — same y-baseline as the "2.17" number (font-size 34 bold ≈ 88px wide)
txt('(baseline 2020)', { x: GHOST_X - 72 + 80, y: valToY(BASELINE.total) - 10, 'text-anchor': 'start',
  'font-size': 11, fill: '#8bc34a', 'font-family': 'Inter,sans-serif', 'font-style': 'italic' }, svg);

// ghost foot (static – 2020 baseline)
const ghostG = el('g', { transform: `translate(${GHOST_X},${CB}) scale(${footScale(BASELINE.total)}) translate(${-ANCHOR_X},${-ANCHOR_Y})`, opacity: 0.5 }, svg);
FOOT_PATHS.forEach(d => el('path', { d, fill: '#c0dca8' }, ghostG));

// ghost value label (static)
txt(BASELINE.total.toFixed(2), { x: GHOST_X - 72, y: valToY(BASELINE.total) - 10,
  'font-size': 34, 'font-weight': 900, fill: '#8bc34a', 'font-family': 'Inter,sans-serif' }, svg);

// ── Dynamic elements (updated on year change) ─────────────────────────────────
// current-year dotted line
const curLine = el('line', { x1: 62, x2: W - 10, stroke: '#5a8a18', 'stroke-width': 1.5, 'stroke-dasharray': '5,4',
  style: 'transition: all 1.1s cubic-bezier(0.25,0.1,0.25,1)' }, svg);

// current foot group
const footG = el('g', { style: 'transition: transform 1.1s cubic-bezier(0.25,0.1,0.25,1)' }, svg);
const bandsG = el('g', { 'clip-path': 'url(#footClip)' }, footG);

// labels group (category names on the right)
// legend is rendered as HTML — no SVG group needed

// value + reduction labels
const valLabel = txt('', { 'font-size': 34, 'font-weight': 900, fill: '#5a9a30',
  'font-family': 'Inter,sans-serif', style: 'transition: x 1.1s cubic-bezier(0.25,0.1,0.25,1), y 1.1s cubic-bezier(0.25,0.1,0.25,1)' }, svg);
const redLabel = txt('', { 'font-size': 22, 'font-weight': 700, fill: '#5a8a18',
  'font-family': 'Inter,sans-serif', 'text-anchor': 'end',
  style: 'transition: all 1.1s cubic-bezier(0.25,0.1,0.25,1)' }, svg);

// ── Render for a given year ───────────────────────────────────────────────────
let currentYear  = 2025;
let lockedCat    = null;   // category pinned by click, persists across year changes
let prevTotal    = null;   // value displayed before current transition (for counter)
let counterRAF   = null;   // requestAnimationFrame handle for the running counter
let prevReduction = null;
let redCounterRAF = null;
const prevPcts = {};    // previous pct per category
const pctRAFs  = {};    // RAF handles per category

const ANIM_MS = 1100;  // must match CSS transition duration

function easeInOutCubic(t) {
  return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
}

function render(year) {
  currentYear = year;
  const d = DATA[year];
  const s = footScale(d.total);
  const yCur = valToY(d.total);

  // dotted current line
  curLine.setAttribute('y1', yCur);
  curLine.setAttribute('y2', yCur);

  // foot transform — x shifts right as year advances
  const currentX = footX(year);
  footG.setAttribute('transform',
    `translate(${currentX},${CB}) scale(${s}) translate(${-ANCHOR_X},${-ANCHOR_Y})`);

  // rebuild bands
  while (bandsG.firstChild) bandsG.removeChild(bandsG.firstChild);
  const bandEls = {};
  let cum = 0;
  ORDER.forEach(cat => {
    const v    = d.cats[cat];
    const yBot = ANCHOR_Y - (cum / d.total) * FOOT_H;
    const yTop = ANCHOR_Y - ((cum + v) / d.total) * FOOT_H;
    const r    = el('rect', { x: -5, y: yTop, width: 300, height: yBot - yTop,
                    fill: COLORS[cat], class: 'cf-band' }, bandsG);
    bandEls[cat] = r;
    cum += v;
  });

  // ── Legend — HTML div to the right of the year selector ──────────────────
  const legendItems = document.getElementById('legendItems');
  const hintEl      = document.getElementById('legendHint');
  legendItems.innerHTML = '';

  const labelEls = {}, pctEls = {};
  hintEl.textContent = lockedCat ? 'click again to release' : '↑ hover · click to pin a category';

  ;[...ORDER].reverse().forEach(cat => {
    const color      = COLORS[cat];
    const targetPct  = Math.round(d.cats[cat] / d.total * 100);
    const startPct   = prevPcts[cat] ?? targetPct;
    prevPcts[cat]    = targetPct;

    const item = document.createElement('div');
    item.className = 'cf-leg-item';
    item.innerHTML =
      `<span class="cf-swatch" style="background:${color};--sw-color:${color}"></span>` +
      `<span class="cf-name">${cat}</span>` +
      `<span class="cf-pct">${startPct}%</span>`;
    legendItems.appendChild(item);

    labelEls[cat] = item;
    pctEls[cat]   = item.querySelector('.cf-pct');

    // counter-animate the pct value
    if (pctRAFs[cat]) { cancelAnimationFrame(pctRAFs[cat]); pctRAFs[cat] = null; }
    const t0p = performance.now();
    (function tickPct(now) {
      const p = Math.min((now - t0p) / ANIM_MS, 1);
      const v = startPct + (targetPct - startPct) * easeInOutCubic(p);
      if (pctEls[cat]) pctEls[cat].textContent = Math.round(v) + '%';
      pctRAFs[cat] = p < 1 ? requestAnimationFrame(tickPct) : null;
    })(performance.now());
  });

  // ── Intro pulse on foot bands (first render only, stops on hover) ─────────
  let introPlayed = !!lockedCat;   // skip intro if a category is already locked
  function playIntro() {
    if (introPlayed) return;
    introPlayed = true;
    ORDER.forEach(cat => bandEls[cat].classList.add('intro'));
    setTimeout(() => ORDER.forEach(cat => bandEls[cat].classList.remove('intro')), 2 * 1600 + 50);
  }
  if (!lockedCat) setTimeout(playIntro, 400);

  // ── Helpers ───────────────────────────────────────────────────────────────
  function applyActive(activeCat) {
    ORDER.forEach(cat => bandEls[cat].classList.remove('intro'));
    ORDER.forEach(cat => {
      const on = cat === activeCat;
      bandEls[cat].classList.toggle('active', on);
      bandEls[cat].classList.toggle('dim',   !on);
      labelEls[cat].classList.toggle('active', on);
      labelEls[cat].classList.toggle('dim',   !on);
      labelEls[cat].classList.toggle('locked', cat === lockedCat);
      pctEls[cat].style.visibility = on ? 'visible' : 'hidden';
    });
  }
  function applyReset() {
    ORDER.forEach(cat => {
      bandEls[cat].classList.remove('active', 'dim', 'intro');
      labelEls[cat].classList.remove('active', 'dim');
      labelEls[cat].classList.toggle('locked', cat === lockedCat);
      pctEls[cat].style.visibility = cat === lockedCat ? 'visible' : 'hidden';
    });
    if (lockedCat) applyActive(lockedCat);
  }

  // ── Event listeners ───────────────────────────────────────────────────────
  ORDER.forEach(cat => {
    [bandEls[cat], labelEls[cat]].forEach(e => {
      e.addEventListener('mouseenter', () => {
        introPlayed = true;
        if (!lockedCat) applyActive(cat);
      });
      e.addEventListener('mouseleave', () => {
        if (!lockedCat) applyReset();
      });
      e.addEventListener('click', () => {
        if (lockedCat === cat) {
          // unlock
          lockedCat = null;
          hintEl.textContent = '↑ hover · click to pin a category';
          applyReset();
        } else {
          // lock to this category
          lockedCat = cat;
          hintEl.textContent = 'click again to release';
          applyActive(cat);
        }
      });
    });
  });

  // restore locked state after rebuild
  if (lockedCat) applyActive(lockedCat);

  // value label
  valLabel.setAttribute('x', currentX - 120);
  valLabel.setAttribute('y', yCur - 10);

  // animated counter: count from previous displayed value to new total
  const targetTotal = d.total;
  const startTotal  = prevTotal ?? targetTotal;
  prevTotal = targetTotal;
  if (counterRAF) { cancelAnimationFrame(counterRAF); counterRAF = null; }
  const t0 = performance.now();
  function tickCounter(now) {
    const p    = Math.min((now - t0) / ANIM_MS, 1);
    const val  = startTotal + (targetTotal - startTotal) * easeInOutCubic(p);
    valLabel.textContent = val.toFixed(2);
    counterRAF = p < 1 ? requestAnimationFrame(tickCounter) : null;
  }
  counterRAF = requestAnimationFrame(tickCounter);

  // reduction label — top-right of chart area, always clear of legend box
  redLabel.setAttribute('x', W - 18);
  redLabel.setAttribute('y', yCur - 8);

  // animated counter for reduction %
  const targetRed = d.reduction;
  const startRed  = prevReduction ?? targetRed;
  prevReduction = targetRed;
  if (redCounterRAF) { cancelAnimationFrame(redCounterRAF); redCounterRAF = null; }
  const t0red = performance.now();
  function tickRed(now) {
    const p   = Math.min((now - t0red) / ANIM_MS, 1);
    const val = startRed + (targetRed - startRed) * easeInOutCubic(p);
    redLabel.textContent = val.toFixed(1) + '%';
    redCounterRAF = p < 1 ? requestAnimationFrame(tickRed) : null;
  }
  redCounterRAF = requestAnimationFrame(tickRed);

  // update buttons + badge
  document.querySelectorAll('.year-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.year) === year);
  });
  document.getElementById('yearSlider').value = year;
  document.getElementById('yearBadge').textContent = year;
}

// ── Build year buttons ────────────────────────────────────────────────────────
const btnsEl = document.getElementById('yearBtns');
[2022,2023,2024,2025].forEach(y => {
  const btn = document.createElement('button');
  btn.className = 'year-btn';
  btn.dataset.year = y;
  btn.textContent = y;
  btn.onclick = () => render(y);
  btnsEl.appendChild(btn);
});

document.getElementById('yearSlider').addEventListener('input', e => render(parseInt(e.target.value)));

render(2025);

// Click anywhere outside a band or legend row → deselect
svg.addEventListener('click', e => {
  if (lockedCat && !e.target.closest('.cf-band') && !e.target.closest('.cf-leg-item')) {
    lockedCat = null;
    render(currentYear);
  }
});
</script>
</body>
